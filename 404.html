<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | JS STEEL</title>
<meta name="theme-color" content="#1e3a8a">

<!--
  이 페이지는 네트워크가 불안정할 때도 표시되어야 하므로
  외부 CDN(Tailwind, Font Awesome, Google Fonts)과 외부 이미지를
  일절 사용하지 않습니다. 모든 스타일은 아래 인라인 CSS 안에 있습니다.
-->
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  background: #0f172a;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  color: #fff;
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR",
               "Hiragino Sans", sans-serif;
  -webkit-text-size-adjust: 100%;
}

.box { width: 100%; max-width: 520px; text-align: center; animation: up .4s ease-out; }

@keyframes up {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── 로고 (이미지 없이 CSS로) ── */
.brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 48px; }
.mark {
  width: 44px; height: 44px; border-radius: 10px;
  background: #fff; color: #1e3a8a;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 900; letter-spacing: -.5px;
  flex-shrink: 0;
}
.brand .txt { text-align: left; }
.brand .nm { font-size: 21px; font-weight: 900; line-height: 1; }
.brand .sub {
  margin-top: 5px; font-size: 10px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; color: #94a3b8;
}

/* ── 404 ── */
.code {
  font-size: 84px; font-weight: 900; line-height: 1;
  color: #60a5fa;
  margin: 0;
}
h1 { font-size: 22px; font-weight: 900; margin: 26px 0 12px; }
.desc { font-size: 14px; line-height: 1.8; color: #cbd5e1; margin: 0 0 40px; }

/* ── 바로가기 ── */
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 32px; }
.links a {
  display: block; padding: 15px 10px; border-radius: 12px;
  font-size: 14px; font-weight: 700; text-decoration: none;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  transition: background .15s;
}
.links a:hover, .links a:active { background: rgba(255,255,255,.2); }
.links a.main {
  background: #2563eb; border-color: #2563eb;
  box-shadow: 0 4px 14px rgba(37,99,235,.4);
}
.links a.main:hover, .links a.main:active { background: #3b82f6; }

/* ── 연락처 ── */
.foot { border-top: 1px solid rgba(255,255,255,.12); padding-top: 26px; }
.foot .q { font-size: 12px; font-weight: 600; color: #94a3b8; margin: 0 0 12px; }
.foot a {
  font-size: 16px; font-weight: 800; color: #fff;
  text-decoration: none; letter-spacing: .5px;
}
.foot a:hover { color: #93c5fd; }
.cp { font-size: 11px; color: #64748b; margin: 40px 0 0; }

@media (max-width: 400px) {
  .code { font-size: 66px; }
  .links { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="box">

  <div class="brand">
    <div class="mark">JS</div>
    <div class="txt">
      <div class="nm">JS STEEL</div>
      <div class="sub">Premium Steel Solution</div>
    </div>
  </div>

  <p class="code">404</p>

  <h1>페이지를 찾을 수 없습니다</h1>
  <p class="desc">
    요청하신 주소가 변경되었거나 삭제되었을 수 있습니다.<br>
    아래 버튼으로 원하시는 곳으로 이동해 주세요.
  </p>

  <div class="links">
    <a href="./" class="main">홈으로</a>
    <a href="./#products">제품소개</a>
    <a href="./#resources">자료실</a>
    <a href="./#location">오시는 길</a>
  </div>

  <div class="foot">
    <p class="q">문의가 필요하신가요?</p>
    <a href="tel:0553353501">055-335-3501~2</a>
  </div>

  <p class="cp">&copy; 2026 JS STEEL Co., Ltd.</p>

</div>

</body>

</html>
